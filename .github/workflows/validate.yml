name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog.yaml
        run: |
          python3 -m pip install --quiet pyyaml
          python3 validate.py

      - name: Bash syntax check signing scripts
        run: |
          set -e
          for f in auth/*.sh; do
            bash -n "$f"
            echo "ok: $f"
          done
